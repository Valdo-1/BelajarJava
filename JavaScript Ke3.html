<body>
    <form action="" method="post">
        <input type="number" id="a1" placeholder="nomer">
        <input type="number" id="a2" placeholder="nomer">
        <select name="" id="operator" required>
            <option value="">Pilih dulu</option>
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">÷</option>
        </select>

        <button onclick="hitungSemua(event)">Hitung</button>
    </form>
    <p id="hasil">Hasil Hitungan</p>
    <script>
        function hitungSemua(event) {
            event.preventDefault();

            let nomor1 = parseFloat(document.querySelector("#a1").value);
            let nomor2 = parseFloat(document.querySelector("#a2").value);
            let opt = document.querySelector("#operator").value;
            let hasil = 0;

            switch (opt) {
                case "+":
                    hasil = nomor1 + nomor2;
                    break;
                case "-":
                    hasil = nomor1 - nomor2;
                    break;
                case "*":
                    hasil = nomor1 * nomor2;
                    break;
                case "/":
                    hasil = (nomor1 == 0 && nomor2 == 0) ? "0 tidak bisa dibagi 0" : (nomor2 == 0) ? "error" : nomor1 / nomor2;
                    break;
                default:
                    break;

            }
            document.querySelector("#hasil").innerHTML = `Hasil Akhir: ${hasil}`;
        }

        //     if (opt == "+") {

        //         //hasil = 0;

        //     document.querySelector("#hasil").innerHTML = `Hasil Akhir: ${hasil}`;

    </script>
