// Operator Perbandingan Kesamaan:
//==	: melakukan kesamaan value satu dengan yang lain.
//==	: melakukan kesamaan value satu dengan yang lain,untuk yang === itu menyamakan juga tipe datanya.

let usianya = "25";
// Hasilnya: "True" 
// Alasan: == hanya peduli isinya sama-sama angka 25, komputer maklum walau tipe datanya berbeda.
console.log(usianya == 25 ? "True" : "False");

// Hasilnya: "False" 🌟 (Berbeda!)
// Alasan: === sangat galak. Isinya memang 25, tapi yang satu TEKS ("25") dan satunya lagi ANGKA (25). Komputer menganggapnya tidak cocok.
console.log(usianya === 25 ? "True" : "False");

let a = 4;

console.log(a !=b); //false
console.log(a !==b); //true

//OPERATOR
//>
//>=
//<
//<=
console.log(`4 > 4 ${4 > 4}`); // false
console.log(`4 >= 4 ${4 >= 4}`); //true
console.log(`4 < 4 ${4 < 4}`); // false
console.log(`4 <= 4 ${4 <=4 }`); // true
